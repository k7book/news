name: probe
on:
  push:
    branches: [main]
    paths: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 probe/vis.py > out.txt
          python3 - <<'PY'
          lines=[l[6:].strip() for l in open("out.txt",encoding="utf-8") if l.startswith("PROBE ")]
          for i,l in enumerate(lines):
              print("::notice title=p%d::%s"%(i,l.replace("::","：")))
          PY
