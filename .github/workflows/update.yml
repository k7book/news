name: update

# 15분마다 깨어나서, 마지막 갱신이 50분 넘게 지났을 때만 수집 → site/ 생성 → Cloudflare Pages에 직접 업로드(wrangler) + deploy 브랜치에 이력 보관
# (Git 연결 방식은 무료 빌드 월 500회 제한이 있어 직접 업로드를 쓴다)
on:
  schedule:
    # GitHub 예약 실행은 붐비면 몇 시간씩 건너뛴다(10/20 새벽 01:24→06:26→10:02).
    # 그래서 15분마다 시도하고, 직전 갱신이 50분 안이면 바로 끝낸다 → 실제 갱신은 약 1시간 간격
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.NEWS }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 이전 이력(history/) 가져오기
        run: |
          git fetch --depth=1 origin deploy || true
          if git rev-parse -q --verify origin/deploy >/dev/null; then
            git checkout origin/deploy -- history || true
            git reset -q
          fi
          mkdir -p history

      - name: 직전 갱신 시각 확인 (예약 실행일 때 50분 안이면 건너뜀)
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          from datetime import datetime, timezone
          try:
              d = json.loads(subprocess.run(["git", "show", "origin/deploy:site/data.json"], capture_output=True, check=True).stdout)
              age = (datetime.now(timezone.utc) - datetime.fromisoformat(d["built"])).total_seconds() / 60
          except Exception:
              age = 999
          print("SKIP=1" if age < 50 else "SKIP=0")
          print(f"LAST_AGE_MIN={age:.0f}")
          PY
          tail -2 "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"

      - name: 수집·생성
        if: env.SKIP != '1'
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trend_site.py

      - name: deploy 브랜치로 올리기
        if: env.SKIP != '1'
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -r site history /tmp/out/
          cp _headers /tmp/out/site/_headers
          printf 'User-agent: *\nDisallow: /\n' > /tmp/out/site/robots.txt
          cd /tmp/out
          git init -q -b deploy
          git add -A
          git -c user.name="news-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "build $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy

      - name: Cloudflare Pages에 올리기
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.SKIP != '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.NEWS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.NEWS1 }}
        run: |
          cp _headers site/_headers
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          set +e
          # 공백·줄바꿈 제거 후 토큰 확인 (값은 출력하지 않음)
          CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]'); export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]'); export CLOUDFLARE_ACCOUNT_ID
          chk() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1" | python3 -c "import json,sys
          d=json.load(sys.stdin); r=d.get('result') or {}
          print('ok' if d.get('success') else 'fail', r.get('status',''), [(e.get('code'), e.get('message')) for e in d.get('errors', [])])"; }
          {
            echo "token length ${#CLOUDFLARE_API_TOKEN}, prefix ${CLOUDFLARE_API_TOKEN:0:5}, account id length ${#CLOUDFLARE_ACCOUNT_ID}"
            echo "user token verify: $(chk https://api.cloudflare.com/client/v4/user/tokens/verify)"
            echo "account token verify: $(chk https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify)"
          } > cf.log 2>&1
          npx --yes wrangler@4.20.0 pages project create news --production-branch main >> cf.log 2>&1
          npx --yes wrangler@4.20.0 pages deploy site --project-name news --branch main --commit-dirty=true >> cf.log 2>&1
          rc=$?
          msg=$(sed -E 's/\x1b\[[0-9;]*m//g' cf.log | grep -vE '^\s*$' | tail -30)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::warning title=wrangler (exit $rc)::$msg"
          exit $rc

