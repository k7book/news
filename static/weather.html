<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* 지금 뜨는 뉴스와 같은 종이색 테마 (다크모드 자동 + 첫 화면에서 고른 테마 따름) */
:root{--ink:#14110c;--ink-soft:#39332a;--paper:#ede6d7;--paper-2:#e3dbc9;--paper-3:#f6f1e6;--rule:#cdc3ac;--muted:#544c3c;--dim:#7a705a;
--red:#b02e20;--teal:#0b5a53;--blue:#2f5fb3;--gold:#b8860b;--hero1:#1d3557;--hero2:#3c4f6e;
--good:#2f6fd6;--ok:#b98a00;--bad:#c2412d;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--serif:"Noto Serif KR","Batang",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#ececf1;--ink-soft:#c9c9d2;--paper:#101014;--paper-2:#16161c;--paper-3:#1b1b22;--rule:#33333d;--muted:#8e8e98;--dim:#6e6e78;
--red:#f0705c;--teal:#5eead4;--blue:#8ab6ff;--gold:#ffd76a;--good:#8ab6ff;--ok:#ffd76a;--bad:#ff8a8a}}
:root[data-theme=dark]{--ink:#ececf1;--ink-soft:#c9c9d2;--paper:#101014;--paper-2:#16161c;--paper-3:#1b1b22;--rule:#33333d;--muted:#8e8e98;--dim:#6e6e78;
--red:#f0705c;--teal:#5eead4;--blue:#8ab6ff;--gold:#ffd76a;--good:#8ab6ff;--ok:#ffd76a;--bad:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.w{max-width:1280px;margin:0 auto;padding:16px 20px 40px}
.top{display:flex;align-items:baseline;gap:14px;border-bottom:3px double var(--ink);padding-bottom:10px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--serif);font-weight:900;font-size:34px;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:14px}
.top .sp{flex:1}
.top a.back{font-size:14px;color:var(--muted);text-decoration:none}.top a.back:hover{color:var(--red)}
.num{font-variant-numeric:tabular-nums}
h2{margin:0 0 10px;font-family:var(--serif);font-size:19px;display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--sans);font-weight:400;color:var(--dim);font-size:12px}
.wcard{background:var(--paper-3);border:1px solid var(--rule);border-radius:4px;padding:16px 18px}
.err{margin:12px 0;padding:10px 14px;border:1px solid var(--rule);border-left:4px solid var(--red);background:var(--paper-3);font-size:14px;line-height:1.6}
/* 배너 */
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:6px;color:#f6f3ea;padding:30px 36px;display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:28px;align-items:center;
  background:linear-gradient(120deg,#13233f 0%,#22385c 50%,#4a3d16 100%)}
.hero.t-night{background:linear-gradient(120deg,#070c1c 0%,#121c36 60%,#1e1d33 100%)}
.hero.t-cloud{background:linear-gradient(120deg,#1a1f28 0%,#2c3340 60%,#333 100%)}
.hero.t-rain{background:linear-gradient(120deg,#0d1a26 0%,#183046 60%,#22303a 100%)}
.hero .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.hero .g1{width:360px;height:360px;left:-80px;top:-140px;background:radial-gradient(circle,rgba(255,205,0,.32),transparent 70%);animation:d1 18s ease-in-out infinite alternate}
.hero .g2{width:440px;height:440px;right:-120px;bottom:-220px;background:radial-gradient(circle,rgba(110,160,255,.32),transparent 70%);animation:d2 22s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(240px,80px)}}@keyframes d2{to{transform:translate(-280px,-60px)}}
.hero>*:not(.glow){position:relative}
.now{display:flex;align-items:center}
.now img{margin:-16px -6px -16px -18px}
.loc{font-size:12px;color:#c9d6f0}
.temp{font-family:var(--serif);font-size:96px;font-weight:900;line-height:1}.temp small{font-size:32px;color:#c4bfb2}
.sky{font-size:24px;font-weight:800;margin-top:2px}.sky span{font-size:14px;font-weight:400;color:#c4bfb2}
.mm{margin-top:4px}.mm .mn{color:#9cc0ff;margin-right:12px}.mm .mx{color:#ff9b9b}
.say{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.45;margin-bottom:6px}
.spark{display:block;width:100%;height:140px;overflow:visible}
.spark .v{fill:#f6f3ea;font-size:12px;font-weight:700}.spark .l{fill:#9aa6bd;font-size:11px}
.spark .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.metrics{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:8px;font-size:14px;color:#c9d6f0}
.metrics b{font-weight:600}
.hero .g-good{color:#9cc0ff}.hero .g-ok{color:#ffe08a}.hero .g-bad{color:#ffa08a}
.src{margin-top:8px;font-size:11px;color:#8794ad}
/* 시간별 */
.hourly{margin-top:16px}
.hrow{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hc{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:4px}
.hc:hover{background:var(--paper-2)}
.hc.d0{border-left:1px solid var(--rule)}
.hc .lb{font-size:12px;color:var(--dim)}.hc .lb b{color:var(--red)}
.hc img{margin:-2px 0}
.hc .tp{font-weight:700}
.hc .pp{font-size:11px;color:var(--dim)}.hc .pp.hi{color:var(--blue);font-weight:700}
/* 아래 3칸 */
.tri{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:stretch}
.tri>.wcard{display:flex;flex-direction:column;min-height:0}
.wr{display:grid;grid-template-columns:72px 38px 38px 40px minmax(0,1fr);align-items:center;gap:6px;padding:5px 2px;border-top:1px solid var(--rule)}
.wr:first-child{border-top:0}
.wr.today{background:var(--paper-2)}
.wr .dd b{font-size:14px}.wr .dd span{color:var(--dim);font-size:11px;margin-left:4px}
.wr .dd.sun b{color:var(--red)}.wr .dd.sat b{color:var(--blue)}
.wr .pp{font-size:12px;color:var(--dim)}.wr .pp.hi{color:var(--blue);font-weight:700}
.wtr{display:flex;align-items:center;gap:6px}.wtr .mn{color:var(--blue);width:30px;text-align:right}.wtr .mx{color:var(--red);width:30px}
.wtr .bar{flex:1;height:6px;border-radius:9px;background:var(--paper-2);position:relative}
.wtr .bar i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#6ea0ff,#ffcd00,#ff6b6b)}
.nil{color:var(--dim);text-align:center}
.ix{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
.it{--c:var(--dim);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:10px;padding:10px;border-radius:6px;position:relative;
  background:color-mix(in srgb,var(--c) 7%,var(--paper-3));border:1px solid color-mix(in srgb,var(--c) 22%,var(--rule))}
.it.good{--c:var(--good)}.it.ok{--c:var(--ok)}.it.bad{--c:var(--bad)}
.it .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.it .ic svg{width:24px;height:24px}
.it b{font-size:15px}.it .tx span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .gr{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--c)}
.lg{font-size:11px;color:var(--dim);font-family:var(--sans);font-weight:400;margin-left:auto}.lg i{font-style:normal;margin:0 2px 0 6px}
.lg .good{color:var(--good)}.lg .ok{color:var(--ok)}.lg .bad{color:var(--bad)}
.nl{list-style:none;margin:0;padding:0;flex:1 1 0;min-height:0;overflow:hidden}
.nl li{padding:8px 0;border-top:1px solid var(--rule)}.nl li:first-child{border-top:0}
.nl a{text-decoration:none;font-weight:600;font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nl a:hover{color:var(--red)}.nl span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.key{margin-top:16px}
footer{margin-top:22px;padding-top:10px;border-top:1px solid var(--rule);color:var(--dim);font-size:12px;line-height:1.7}
@media (max-width:1000px){.hero{grid-template-columns:1fr;padding:22px}.tri{grid-template-columns:1fr}.temp{font-size:76px}}
@media (prefers-reduced-motion:reduce){.hero .glow,.spark .ln{animation:none;stroke-dashoffset:0}}
/* ---- 지금 뜨는 뉴스 색 한 벌로 맞춤 (11-09) : 종이색·먹·빨강·청록·금 ---- */
:root{--good:var(--teal);--ok:var(--gold);--bad:var(--red);--lo:var(--teal);--hi:var(--red)}
.hero,.hero.t-night,.hero.t-cloud,.hero.t-rain{background:var(--paper-3);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--red)}
.hero .g1{background:radial-gradient(circle,color-mix(in srgb,var(--gold) 28%,transparent),transparent 70%)}
.hero .g2{background:radial-gradient(circle,color-mix(in srgb,var(--teal) 22%,transparent),transparent 70%)}
.loc,.metrics,.sky span,.temp small{color:var(--muted)}
.src{color:var(--dim)}
.mm .mn{color:var(--lo)}.mm .mx{color:var(--hi)}
.spark .v{fill:var(--ink)}.spark .l{fill:var(--dim)}
.spark polyline{stroke:var(--red)}.spark circle{fill:var(--red)}.spark stop{stop-color:var(--red)}
.hero .g-good{color:var(--good)}.hero .g-ok{color:var(--ok)}.hero .g-bad{color:var(--bad)}
.metrics b{color:var(--ink)}
.hc .pp.hi,.wr .pp.hi{color:var(--teal)}
.hc .lb b{color:var(--red)}
.wtr .mn{color:var(--lo)}.wtr .mx{color:var(--hi)}.wr .dd.sat b{color:var(--teal)}
.wtr .bar i{background:linear-gradient(90deg,var(--teal),var(--gold),var(--red))}
.wcard{border-radius:6px}
.top{border-bottom:0;padding:14px 0 0;margin-top:4px}.top h1{font-size:26px}.top .sub{font-size:13px}
.w{max-width:1280px}
.spark polyline{stroke:var(--tc)}.spark circle{fill:var(--tc)}.spark stop{stop-color:var(--tc)}
:root{--cold:#2f6fb8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cold:#7fb2ff}}:root[data-theme=dark]{--cold:#7fb2ff}
.hero,.hero.t-night,.hero.t-cloud,.hero.t-rain{border-top-color:var(--ink)}
/* 10일 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:12px;color:var(--dim);padding:2px 0 4px;border-bottom:1px solid var(--rule)}.cw.sun{color:var(--red)}.cw.sat{color:var(--cold)}
.cc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 8px;border-radius:6px;background:var(--paper-2);min-height:122px}
.cc.off{background:transparent;opacity:.45}
.cc.today{outline:2px solid var(--red);outline-offset:-2px;background:var(--paper-3)}
.cc .cd{font-size:13px;font-weight:700;align-self:flex-start;padding-left:4px}.cc.sun .cd{color:var(--red)}.cc.sat .cd{color:var(--cold)}
.cc .cd em{font-style:normal;font-size:10px;font-weight:700;color:var(--red);margin-left:4px}
.cc img{margin:-2px 0}
.cc .ct{display:flex;gap:4px;font-size:13px;font-weight:700}.cc .ct i{font-style:normal}.cc .ct .mn{color:var(--cold)}.cc .ct .mx{color:var(--red)}
.cc .cp{font-size:11px;color:var(--dim);min-height:14px}.cc .cp.hi{color:var(--cold);font-weight:700}
.mm .mn,.wtr .mn{color:var(--cold)}
/* ── 네이버 날씨 배치 ── */
.nv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;margin-top:14px;align-items:start}
.nvl,.nvr{display:flex;flex-direction:column;gap:14px;min-width:0}
.wcard{background:var(--paper-3);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.h2row{display:flex;align-items:center;gap:10px;margin-bottom:10px}.h2row h2{margin:0;font-size:18px}.h2row .hint{font-size:12px;color:var(--dim);margin-left:auto}
.now2 .locbar{display:flex;align-items:baseline;gap:10px}.now2 .locbar b{font-size:18px}.now2 .locbar span{font-size:12px;color:var(--dim)}
.nowrow{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:6px 20px;margin-top:6px}
.nowrow>img{margin:-14px -10px -14px -14px}
.now2 .temp{font-size:72px;color:var(--ink)}.now2 .temp small{font-size:28px;color:var(--muted)}
.now2 .sky{font-size:20px;font-weight:800;margin:0}.now2 .mm{font-size:14px}.now2 .mm .mn{color:var(--cold)}.now2 .mm .mx{color:var(--red)}
.nowdl{display:grid;grid-template-columns:auto auto;gap:6px 14px;margin:0 0 0 auto;font-size:14px;justify-self:end}.nowdl dt{color:var(--dim)}.nowdl dd{margin:0;font-weight:700;text-align:right}
.rainline{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--paper-2);color:var(--muted)}.rainline.wet{background:color-mix(in srgb,var(--cold) 14%,transparent);color:var(--cold)}.rainline.may{background:color-mix(in srgb,var(--cold) 8%,transparent);color:var(--cold)}
.pills{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0}
.pills li{padding:6px 12px;border-radius:999px;background:var(--paper-2);font-size:13px;color:var(--muted)}.pills li b{margin-left:4px;color:var(--ink)}
.pills li.good b{color:var(--teal)}.pills li.ok b{color:var(--gold)}.pills li.bad b{color:var(--red)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.td{border:1px solid var(--rule);border-radius:8px;padding:10px 12px}.td.on{border-color:var(--ink)}
.tdhd{display:flex;align-items:baseline;gap:6px;font-size:13px}.tdhd b{font-size:15px}.tdhd span{color:var(--dim)}.tdhd .num{color:var(--ink);font-weight:700}.tdhd i{font-style:normal}.tdhd .mn{color:var(--cold)}.tdhd .mx{color:var(--red)}
.tdb{display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.tdh{display:flex;flex-direction:column;align-items:center;gap:1px}.tdh .lab{font-size:11px;color:var(--dim)}.tdh img{margin:-4px 0}.tdh .tsky{font-size:13px;font-weight:600}.tdh .tpop{font-size:11px;color:var(--dim)}.tdh .tpop.hi{color:var(--cold);font-weight:700}
.htabs{display:flex;gap:4px;margin-left:auto}.ht{all:unset;cursor:pointer;padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid var(--rule)}.ht.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hscroll{overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.hrow2{display:flex}.hc2{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;height:72px}.hc2.d0{border-left:1px solid var(--rule)}
.hc2 .lb{font-size:12px;color:var(--dim)}.hc2 .lb b{color:var(--red)}
.hc2 .wd{display:inline-block;font-size:20px;font-weight:700;color:var(--teal);margin-top:6px}.hc2 .lb2{font-size:11px;color:var(--dim)}
.hgraph{display:block}.hgraph .v{font-size:12px;font-weight:700;fill:var(--ink)}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:grid;grid-template-columns:120px 120px 120px 1fr;align-items:center;padding:6px 6px;border-top:1px solid var(--rule)}.wlist li:first-child{border-top:0}.wlist li.on{background:var(--paper-2);border-radius:6px}
.wdd b{font-size:15px}.wdd span{color:var(--dim);font-size:12px;margin-left:6px}.wdd.sun b{color:var(--red)}.wdd.sat b{color:var(--cold)}
.wh{display:flex;align-items:center;gap:6px;justify-content:center}.wpop{font-size:12px;color:var(--dim);width:32px;text-align:right}.wpop.hi{color:var(--cold);font-weight:700}
.wt{display:flex;gap:6px;justify-content:flex-end;font-size:15px;font-weight:700}.wt i{font-style:normal}.wt .mn{color:var(--cold)}.wt .mx{color:var(--red)}.wt span{color:var(--dim);font-weight:400}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:6px}.ring{text-align:center;font-size:13px;color:var(--muted)}.ring svg{width:120px;height:120px}
.ring.good{color:var(--teal)}.ring.ok{color:var(--gold)}.ring.bad{color:var(--red)}.ring span{display:block;color:var(--muted);margin-top:-14px}
.ring .rg{font-size:16px;font-weight:800;fill:currentColor}.ring .rv{font-size:10px;fill:var(--dim)}
.ixl{list-style:none;margin:0;padding:0}
.ixl li{--c:var(--dim);display:grid;grid-template-columns:32px 52px 1fr auto;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule)}.ixl li:first-child{border-top:0}
.ixl li.good{--c:var(--teal)}.ixl li.ok{--c:var(--gold)}.ixl li.bad{--c:var(--red)}
.ixl .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}.ixl .ic svg{width:18px;height:18px}
.ixl b{font-size:14px}.ixl .tip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ixl em{font-style:normal;font-size:12px;font-weight:700;color:var(--c)}
.sunarc svg{display:block;width:100%;max-width:280px;margin:0 auto}.sunt{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);max-width:280px;margin:2px auto 0}.sunt b{color:var(--ink);font-size:15px;margin-left:4px}
.nb .nl{flex:none;overflow:visible}
@media (max-width:1000px){.nv{grid-template-columns:1fr}.three{grid-template-columns:1fr}.nowrow{grid-template-columns:auto 1fr}.nowdl{grid-column:1/-1;justify-self:start}}
/* 시간별 그래프 꾸밈 · 10일 예보 합침 (11-09) */
.hgraph .nightb{fill:var(--ink);opacity:.045}
.hgraph .dayl{stroke:var(--rule);stroke-dasharray:3 4}
.hgraph .nowl{stroke:var(--red);stroke-width:1.5;stroke-dasharray:2 3;opacity:.7}
.hgraph .v{font-size:12px;font-weight:700;fill:var(--ink)}.hgraph .v.ext{font-size:13px}
.hgraph .pb{font-size:11px;fill:var(--cold);font-weight:700}
.hgraph .hline{filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.hc2{height:66px}
.rest{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.rd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:var(--paper-2)}
.rdd{display:flex;flex-direction:column;align-items:center;line-height:1.2}.rdd b{font-size:14px}.rdd span{font-size:11px;color:var(--dim)}
.rdd.sun b{color:var(--red)}.rdd.sat b{color:var(--cold)}
.rdi{display:flex;gap:0;margin:-2px 0}
.rdp{font-size:11px;color:var(--dim)}.rdp.hi{color:var(--cold);font-weight:700}
.rdt{display:flex;gap:6px;font-size:14px;font-weight:700}.rdt i{font-style:normal}.rdt .mn{color:var(--cold)}.rdt .mx{color:var(--red)}
.three .td{padding:14px}.three .tdh img{width:64px;height:64px}
@media (max-width:1000px){.rest{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* 월출월몰 · 지난 날씨 · 전국 날씨 (11-09) */
.moonrow{display:flex;align-items:center;gap:14px}.moon{width:72px;height:72px}.moonrow b{font-size:17px}
.rs{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.rs th{font-weight:400;color:var(--dim);font-size:12px;text-align:right;padding:2px 4px}.rs th:first-child{text-align:left}
.rs td{padding:6px 4px;border-top:1px solid var(--rule);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.rs td:first-child{text-align:left;font-weight:400;color:var(--muted)}
.sunarc + .rs{margin-top:4px}
.past{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:8px;background:var(--paper-2)}
.pdd{display:flex;flex-direction:column;align-items:center;line-height:1.2}.pdd b{font-size:14px}.pdd span{font-size:11px;color:var(--dim)}
.pbar{display:flex;flex-direction:column;align-items:center;gap:2px}.pbar .mx{color:var(--red);font-weight:700;font-size:13px}.pbar .mn{color:var(--cold);font-weight:700;font-size:13px}
.pv{position:relative;width:8px;height:70px;border-radius:9px;background:var(--paper-3)}.pv i{position:absolute;left:0;right:0;border-radius:9px;background:linear-gradient(180deg,var(--red),var(--cold))}
.prn{font-size:11px;color:var(--dim)}.prn.hi{color:var(--cold);font-weight:700}.pex{font-size:10px;color:var(--dim);text-align:center}
.nmap{position:relative;height:540px;border-radius:10px;background:radial-gradient(ellipse at 45% 45%,var(--paper-2),var(--paper-3) 70%);overflow:hidden}
.nc{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:var(--paper-3);border:1px solid var(--rule);border-radius:999px;padding:2px 10px 2px 4px;box-shadow:0 2px 6px rgba(0,0,0,.07);white-space:nowrap}
.nc img{width:30px;height:30px;margin:-2px -2px}.nc b{font-size:12px;color:var(--muted);font-weight:600}.nc span{font-size:15px;font-weight:800}
.nc.me{border-color:var(--red);box-shadow:0 0 0 2px color-mix(in srgb,var(--red) 25%,transparent)}.nc.me b{color:var(--red)}
/* 전국 지도 · 강수 숫자 (11-09) */
.nwrap{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:18px;align-items:start}
.nmap{height:auto!important;aspect-ratio:3/4;background:none!important;overflow:visible!important}
.nmap .kr{position:absolute;inset:0;width:100%;height:100%}
.nmap .ks{fill:var(--paper-2);stroke:var(--rule);stroke-width:2}.nmap .kn{fill:var(--paper-2);opacity:.45}
.ntab{width:100%;border-collapse:collapse;font-size:13px}.ntab th{font-weight:400;color:var(--dim);font-size:12px;text-align:left;padding:4px}
.ntab td{padding:5px 4px;border-top:1px solid var(--rule)}.ntab td:last-child{text-align:right;font-weight:700}.ntab tr.me td{color:var(--red);font-weight:700}
.hgraph .v.zero{fill:var(--dim);font-weight:400}.hgraph .pmm{font-size:11px;fill:var(--dim)}
@media (max-width:1000px){.nwrap{grid-template-columns:1fr}}
.ntab td.nic{padding:0 4px}.ntab td.nic img{display:block}
/* 지난 15일 차트 */
.pscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}#pastc{margin-top:18px}
.pchart{display:block}.pchart .pmx{font-size:13px;font-weight:700;fill:var(--red)}.pchart .pmn{font-size:13px;font-weight:700;fill:var(--cold)}
.plabs{display:grid;border-top:1px solid var(--rule);padding-top:6px}
.pl{display:flex;flex-direction:column;align-items:center;line-height:1.25}.pl b{font-size:13px}.pl span{font-size:11px;color:var(--dim)}.pl em{font-style:normal;font-size:11px;color:var(--dim)}.pl em.hi{color:var(--cold);font-weight:700}
.pl.sun b{color:var(--red)}.pl.sat b{color:var(--cold)}

      <div class="rdp${pop >= 50 ? " hi" : ""}">${pop ? "☂ " + pop + "%" : "&nbsp;"}</div><div class="rdt num"><i class="mn">${Math.round(d.tmin)}°</i><i class="mx">${Math.round(d.tmax)}°</i></div></div>`; }).join("");
  const weekCard = `<section class="wcard"><div class="h2row"><h2>10일 예보</h2><span class="hint">3일은 기상청 단기예보, 그 뒤는 중기예보</span></div>
    <div class="three">${three}</div><div class="rest">${rest}</div></section>`;
  // ⑤ 미세먼지 (오른쪽)
  const ring = (v, max, g, label) => { const r = 40, c = 2 * Math.PI * r, f = Math.min(1, (parseFloat(v) || 0) / max) * .75;
    return `<div class="ring ${g.c}"><svg viewBox="0 0 100 100"><g transform="rotate(135 50 50)"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--paper-2)" stroke-width="9" stroke-dasharray="${c * .75} ${c}" stroke-linecap="round"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="currentColor" stroke-width="9" stroke-dasharray="${c * f} ${c}" stroke-linecap="round"/></g><text x="50" y="50" text-anchor="middle" class="rg">${g.t}</text><text x="50" y="66" text-anchor="middle" class="rv">${v && v !== "-" ? v + "㎍/㎥" : ""}</text></svg><span>${label}</span></div>`; };
  const dustCard = `<section class="wcard"><div class="h2row"><h2>미세먼지</h2><span class="hint">에어코리아 ${esc(A.station || "")} ${esc((A.dataTime || "").slice(11))}</span></div><div class="rings">${ring(A.pm10Value, 150, p10, "미세먼지")}${ring(A.pm25Value, 75, p25, "초미세먼지")}</div></section>`;

  // ⑥ 생활지수 (오른쪽, 목록)
  const dayH = keys.filter(k => k.startsWith(today) && +k.slice(8, 10) >= 9 && +k.slice(8, 10) <= 18).map(k => H[k]);
  const dh = dayH.length ? dayH : keys.slice(0, 10).map(k => H[k]);
  const maxPop = Math.max(...dh.map(h => +h.POP || 0)), rain = dh.some(h => +h.PTY > 0), avgReh = dh.reduce((s, h) => s + (+h.REH || 0), 0) / dh.length;
  const maxW = Math.max(...dh.map(h => +h.WSD || 0)), ts = dh.map(h => +h.TMP), dmax = Math.max(...ts), dmin = Math.min(...ts);
  const soon = keys.filter(k => k >= nowKey).slice(0, 36).some(k => +H[k].POP >= 60 || +H[k].PTY > 0);
  const lv = s => s >= 2 ? "bad" : s >= 1 ? "ok" : "good";
  const IX = [["자외선", uvC], ["빨래", lv((rain || maxPop >= 60 ? 2 : maxPop >= 30 ? 1 : 0) + (avgReh >= 80 ? 1 : 0) + (dmax < 5 ? 1 : 0))], ["세차", soon ? "bad" : maxPop >= 30 ? "ok" : "good"],
    ["산책", walk({TMP: (dmax + dmin) / 2, POP: maxPop, WSD: maxW, PTY: rain ? 1 : 0}, p10.c)], ["달리기", lv((rain ? 2 : maxPop >= 50 ? 1 : 0) + (dmax > 28 || dmin < -5 ? 1 : 0) + (p25.c === "bad" ? 1 : 0))],
    ["자전거", lv((rain ? 2 : 0) + (maxW >= 7 ? 1 : 0) + (dmin < 0 ? 1 : 0))], ["감기", dmin < -5 ? "bad" : (dmax - dmin >= 10 || dmin < 0) ? "ok" : "good"],
    ["마스크", p10.c === "bad" || p25.c === "bad" ? "bad" : p10.c === "ok" || p25.c === "ok" ? "ok" : "good"]];
  const ixCard = `<section class="wcard"><div class="h2row"><h2>생활지수</h2><span class="hint">자외선은 기상청, 나머지는 예보로 계산</span></div><ul class="ixl">${IX.map(([n, c]) => `<li class="${c}"><span class="ic">${IXI[n]}</span><b>${n}</b><span class="tip">${c ? TIP[n][GI[c]] : "–"}</span><em>${c ? GN[c] : "–"}</em></li>`).join("")}</ul></section>`;

  // ⑦ 일출 · 일몰 (오른쪽)
  const frac = !night && now.getHours() + now.getMinutes() / 60 > S.rH ? Math.min(1, (hNow - S.rH) / (S.sH - S.rH)) : null;
  const R = 70, cx = 90, cy = 82, ang = frac == null ? null : Math.PI * (1 - frac), sx = ang == null ? 0 : cx + R * Math.cos(ang), sy = ang == null ? 0 : cy - R * Math.sin(ang);
  const sunCard = `<section class="wcard"><div class="h2row"><h2>일출 · 일몰</h2></div><div class="sunarc"><svg viewBox="0 0 180 92"><path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy}" fill="none" stroke="var(--rule)" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
    ${frac == null ? "" : `<path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${sx.toFixed(1)} ${sy.toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" fill="#ffcd00"/>`}<line x1="6" y1="${cy}" x2="174" y2="${cy}" stroke="var(--rule)"/></svg>
    <div class="sunt num"><span>일출 <b>${S.rise}</b></span><span>일몰 <b>${S.set}</b></span></div></div></section>`;

  // ⑧ 월출 · 월몰
  const tmw = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 12);
  const t2 = d => d ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "—";
  const mT = MOON.riseSet(now, loc.lat, loc.lon), mN = MOON.riseSet(tmw, loc.lat, loc.lon), mi = MOON.illum(now), ph = mi.phase;
  const mr = 30, mc = 36, kk = Math.cos(2 * Math.PI * ph), rx = Math.abs(kk) * mr, wax = ph < .5, sw = wax ? (kk > 0 ? 0 : 1) : (kk > 0 ? 1 : 0);
  const lit = (ph < .02 || ph > .98) ? "" : `<path d="M${mc} ${mc - mr} A${mr} ${mr} 0 0 ${wax ? 1 : 0} ${mc} ${mc + mr} A${rx.toFixed(2)} ${mr} 0 0 ${sw} ${mc} ${mc - mr}Z" fill="#f4ecd0"/>`;
  const moonCard = `<section class="wcard"><div class="h2row"><h2>월출 · 월몰</h2><span class="hint">밝은 부분 ${Math.round(mi.fraction * 100)}% · 월령 ${(ph * 29.53).toFixed(1)}일</span></div>
    <div class="moonrow"><svg viewBox="0 0 72 72" class="moon"><circle cx="${mc}" cy="${mc}" r="${mr}" fill="#5b5b60"/>${lit}<circle cx="26" cy="28" r="4" fill="#000" opacity=".12"/><circle cx="45" cy="44" r="6" fill="#000" opacity=".1"/></svg><div><b>${moonName(mi)}</b></div></div>
    <table class="rs"><tr><th></th><th>월출</th><th>월몰</th></tr><tr><td>오늘</td><td>${t2(mT.rise)}</td><td>${t2(mT.set)}</td></tr><tr><td>내일</td><td>${t2(mN.rise)}</td><td>${t2(mN.set)}</td></tr></table></section>`;

  // ⑨ 지난 15일 (문산 관측소) — 칸 폭은 그린 뒤 카드 너비에 맞춰 drawPast() 가 채움
  const P = (D.past || []).slice(-15).filter(r => r.maxTa !== "" && r.minTa !== "");
  const pastCard = P.length ? `<section class="wcard" id="pastc"><div class="h2row"><h2>지난 날씨</h2><span class="hint">최근 ${P.length}일 · 기상청 문산 관측소(파주) · ☂ 비 온 양(mm)</span></div><div class="pscroll"></div></section>` : "";
  window.__P = P;

  // ⑩ 전국 날씨 (위경도로 자리 잡은 지도식 배치, 붙어 있는 도시는 조금씩 비켜 놓음)
  const NOFF = {"파주": [-30, -34], "서울": [48, -4], "인천": [-46, 30], "수원": [-34, 14], "청주": [36, -6], "대전": [-16, 24], "안동": [10, -24], "대구": [-20, 22], "울산": [34, -8], "부산": [-14, 26], "춘천": [10, -10], "전주": [-10, 0]};
  const NC = (D.nation || []).filter(c => c.t != null);
  let nationCard = "";
  if(NC.length){ const X = lon => (lon - 125.0) / (130.2 - 125.0) * 100, Y = lat => (38.75 - lat) / (38.75 - 33.05) * 100;
    nationCard = `<section class="wcard"><div class="h2row"><h2>전국 날씨</h2><span class="hint">기상청 초단기실황 · 주요 도시</span></div><div class="nwrap"><div class="nmap"><svg class="kr" viewBox="0 0 750 1000" preserveAspectRatio="none"><path d="${KR_NORTH}" class="kn"/><path d="${KR_SOUTH}" class="ks"/></svg>${NC.map(c => { const sk2 = sky(c.sky, +c.pty || +c.upty);
      const o = NOFF[c.name] || [0, 0];
      return `<div class="nc${c.name === "파주" ? " me" : ""}" style="left:calc(${X(c.lon)}% + ${o[0]}px);top:calc(${Y(c.lat)}% + ${o[1]}px)">${ic(sk2, night, 30)}<b>${esc(c.name)}</b><span class="num" style="color:${+c.t <= 5 ? "var(--cold)" : +c.t >= 25 ? "var(--red)" : "var(--ink)"}">${Math.round(+c.t * 10) / 10}°</span></div>`; }).join("")}</div><table class="ntab"><tr><th>도시</th><th>날씨</th><th>기온</th></tr>${NC.map(c => `<tr class="${c.name === "파주" ? "me" : ""}"><td>${esc(c.name)}</td><td class="nic">${ic(sky(c.sky, +c.pty || +c.upty), night, 28)}</td><td class="num">${Math.round(+c.t * 10) / 10}°</td></tr>`).join("")}</table></div></section>`; }

  html += `<div class="nv"><div class="nvl">${nowCard}${hourCard}${weekCard}${nationCard}</div><aside class="nvr">${dustCard}${ixCard}${sunCard}${moonCard}${newsCard}</aside></div>${pastCard}`;
  body.innerHTML = html;
  drawPast();
  body.querySelectorAll("[data-ht]").forEach(b => b.onclick = () => { HT = b.dataset.ht; const x = body.querySelector(".hscroll").scrollLeft; render(window.__D); body.querySelector(".hscroll").scrollLeft = x; });
  const hs = body.querySelector(".hscroll"); if(hs) hs.addEventListener("wheel", e => { if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ hs.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive: false});
}
fetch("weather.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(e => { $("#body").innerHTML = `<div class="err">날씨 자료를 불러오지 못했어요: ${esc(e.message)}</div>`; });
</script>
</body></html>
