a{color:inherit}

.hero.t-rain{background:linear-gradient(120deg,#0d1a26 0%,#183046 60%,#22303a 100%)}

.loc{font-size:12px;color:#c9d6f0}

  if(+h.PTY > 0 || pop >= 60) s += 2; else if(pop >= 30) s += 1; if(t < 0 || t > 31) s += 2; else if(t < 5 || t > 28) s += 1;

function sun(lat, lon, d){ const r = Math.PI / 180, day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5), g = 2 * Math.PI / 365 * (day - .5);
  const eq = 229.18 * (.000075 + .001868 * Math.cos(g) - .032077 * Math.sin(g) - .014615 * Math.cos(2 * g) - .040849 * Math.sin(2 * g));

  const hNow = now.getHours() + now.getMinutes() / 60, night = hNow < S.rH || hNow >= S.sH;
  const today = nowKey.slice(0, 8), tt = keys.filter(k => k.startsWith(today)).map(k => +H[k].TMP);
  const tmn = keys.map(k => H[k]).find((h, i) => keys[i].startsWith(today) && h.TMN != null)?.TMN ?? (tt.length ? Math.min(...tt) : "");
  const tmx = keys.map(k => H[k]).find((h, i) => keys[i].startsWith(today) && h.TMX != null)?.TMX ?? (tt.length ? Math.max(...tt) : "");
  // 오늘 한 문장
  const next = keys.filter(k => k >= nowKey).slice(0, 24).map(k => [k, H[k]]);
  const rainAt = next.find(([, h]) => +h.PTY > 0 || +h.POP >= 60);
  const low = Math.min(...next.map(([, h]) => +h.TMP).filter(v => !isNaN(v)));
  let say = rainAt ? `${rainAt[0].slice(0, 8) !== today ? "내일 " : ""}${+rainAt[0].slice(8, 10)}시쯤부터 ${sky(rainAt[1].SKY, rainAt[1].PTY) === "눈" ? "눈" : "비"} 소식이 있어요.`
                   : now.getHours() < 15 ? `오후엔 ${Math.round(tmx)}°까지 오르고 ${sk === "맑음" ? "맑아요" : sk + "이에요"}.` : `저녁까지 ${sk === "맑음" ? "맑아요" : sk + "이에요"}.`;
  if(isFinite(low)) say += low <= 0 ? ` 밤에는 ${low}°, 영하로 떨어져요.` : ` 밤 최저 ${low}°.`;
  say += (p10.c === "bad" || p25.c === "bad") ? " 미세먼지가 나빠요." : ` 미세먼지는 ${p10.t}.`;
  // 기온 그래프 (12시간)
  const g = keys.filter(k => k >= nowKey).slice(0, 13), vals = g.map(k => +H[k].TMP);
  let spark = "";
  if(vals.length > 1){ const W = 800, Hh = 128, P = 16, mn = Math.min(...vals), mx = Math.max(...vals), sp = Math.max(1, mx - mn);
    const xs = vals.map((_, i) => P + i * (W - 2 * P) / (vals.length - 1)), ys = vals.map(v => Hh - 30 - (v - mn) / sp * (Hh - 62));
    const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
    spark = `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffcd00" stop-opacity=".35"/><stop offset="1" stop-color="#ffcd00" stop-opacity="0"/></linearGradient></defs>
      <path d="M${xs[0]},${Hh - 22} L${pts.replace(/ /g, " L")} L${xs[xs.length - 1]},${Hh - 22} Z" fill="url(#gg)"/><polyline class="ln" pathLength="1" points="${pts}" fill="none" stroke="#ffcd00" stroke-width="2.6"/>
      ${xs.map((x, i) => `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.2" fill="#ffcd00"/><text x="${x.toFixed(1)}" y="${(ys[i] - 9).toFixed(1)}" text-anchor="middle" class="v">${Math.round(vals[i])}°</text><text x="${x.toFixed(1)}" y="${Hh - 4}" text-anchor="middle" class="l">${i ? +g[i].slice(8, 10) + "시" : "지금"}</text>`).join("")}</svg>`; }
  const tone = /비|눈|소나기/.test(sk) ? "rain" : /흐림/.test(sk) ? "cloud" : night ? "night" : "day";
  const errs = Object.entries(D.errors || {});
  let html = errs.length ? `<div class="err">일부 자료를 못 받았어요 — ${errs.map(([k, v]) => `<b>${esc(k)}</b>: ${esc(v)}`).join(" · ")}</div>` : "";
  html += `<section class="hero t-${tone}"><i class="glow g1"></i><i class="glow g2"></i>
    <div class="now">${ic(sk, night, 170)}<div><div class="loc">${esc(loc.name)}</div>
      <div class="temp num">${t != null && t !== "" ? Math.round(+t * 10) / 10 : "–"}<small>°</small></div>
      <div class="sky">${esc(sk)} <span>· 체감 ${fl != null ? fl + "°" : "–"}</span></div>
      ${tmn !== "" ? `<div class="mm num"><span class="mn">최저 ${Math.round(tmn)}°</span><span class="mx">최고 ${Math.round(tmx)}°</span></div>` : ""}</div></div>
    <div><div class="say">${esc(say)}</div>${spark}
      <div class="metrics"><span>습도 <b>${N.REH ?? "–"}%</b></span><span>바람 <b>${dir8(N.VEC)} ${N.WSD ?? "–"}m/s</b></span>
        <span class="g-${p10.c}">미세먼지 <b>${p10.t}</b> ${A.pm10Value && A.pm10Value !== "-" ? A.pm10Value : ""}</span><span class="g-${p25.c}">초미세먼지 <b>${p25.t}</b> ${A.pm25Value && A.pm25Value !== "-" ? A.pm25Value : ""}</span>
        <span>일출 <b>${S.rise}</b> · 일몰 <b>${S.set}</b></span></div>
      <div class="src">기상청 실황 ${N.at ? N.at.slice(8, 10) + ":" + N.at.slice(10, 12) : ""} · 에어코리아 ${esc(A.station || "")} ${esc((A.dataTime || "").slice(11))}</div></div></section>`;
  // 시간별 48
  const hrs = keys.filter(k => k >= nowKey).slice(0, 48);
  html += `<section class="card hourly"><h2>시간별 <small>48시간 · 기상청 단기예보 · 칸에 마우스를 올리면 바람·습도</small></h2><div class="hrow">${hrs.map((k, i) => { const h = H[k], hh = +k.slice(8, 10);
    return `<div class="hc${hh === 0 ? " d0" : ""}" title="${esc(`${sky(h.SKY, h.PTY)} ${h.TMP}° · 강수확률 ${h.POP}% · ${dir8(h.VEC)} ${h.WSD}m/s · 습도 ${h.REH}%`)}"><div class="lb">${hh === 0 ? `<b>${dlab(k.slice(0, 8), now).rel}</b>` : i === 0 ? "지금" : hh + "시"}</div>${ic(sky(h.SKY, h.PTY), hh < S.rH || hh >= S.sH, 40)}<div class="tp num">${Math.round(+h.TMP)}°</div><div class="pp${+h.POP >= 50 ? " hi" : ""}">${h.POP}%</div></div>`; }).join("")}</div></section>`;
  // 주간 10일
  const byDay = {}, days = [];
  keys.forEach(k => (byDay[k.slice(0, 8)] = byDay[k.slice(0, 8)] || []).push([k, H[k]]));
  Object.keys(byDay).sort().forEach(d => { const L = byDay[d], am = L.filter(([k]) => +k.slice(8, 10) < 12), pm_ = L.filter(([k]) => +k.slice(8, 10) >= 12);
    const pick = a => { if(!a.length) return null; const r = a.find(([, h]) => +h.PTY > 0), m = a[Math.floor(a.length / 2)][1]; return {sky: r ? sky(r[1].SKY, r[1].PTY) : sky(m.SKY, m.PTY), pop: Math.max(...a.map(([, h]) => +h.POP || 0))}; };
    const ts = L.map(([, h]) => +h.TMP); const n0 = L.find(([, h]) => h.TMN != null)?.[1].TMN, x0 = L.find(([, h]) => h.TMX != null)?.[1].TMX;
    if(L.length >= 6) days.push({date: d, am: pick(am), pm: pick(pm_), tmin: n0 ?? Math.min(...ts), tmax: x0 ?? Math.max(...ts)}); });
  ((D.mid && D.mid.days) || []).forEach(m => { if(!days.find(x => x.date === m.date)) days.push({date: m.date, am: m.am ? {sky: m.am, pop: m.popAm} : null, pm: m.pm ? {sky: m.pm, pop: m.popPm} : null, tmin: m.tmin, tmax: m.tmax}); });
  days.sort((a, b) => a.date.localeCompare(b.date));
  const list = days.slice(0, 10), all = list.flatMap(d => [+d.tmin, +d.tmax]).filter(v => !isNaN(v)), lo = Math.min(...all), rng = Math.max(1, Math.max(...all) - lo);
  const wk = list.map(d => { const L = dlab(d.date, now), we = L.d.getDay() === 0 ? " sun" : L.d.getDay() === 6 ? " sat" : "";
    const pop = Math.max(+(d.am && d.am.pop) || 0, +(d.pm && d.pm.pop) || 0), a = (+d.tmin - lo) / rng * 100, b = (+d.tmax - lo) / rng * 100;
    return `<div class="wr${L.rel === "오늘" ? " today" : ""}"><div class="dd${we}"><b>${L.rel}</b><span>${L.md}</span></div>${d.am ? ic(d.am.sky, false, 34) : '<span class="nil">–</span>'}${d.pm ? ic(d.pm.sky, false, 34) : '<span class="nil">–</span>'}
      <span class="pp${pop >= 50 ? " hi" : ""}">${pop}%</span><div class="tr num"><span class="mn">${Math.round(d.tmin)}°</span><span class="bar"><i style="left:${a}%;right:${100 - b}%"></i></span><span class="mx">${Math.round(d.tmax)}°</span></div></div>`; }).join("");
  // 생활지수
  const dayH = keys.filter(k => k.startsWith(today) && +k.slice(8, 10) >= 9 && +k.slice(8, 10) <= 18).map(k => H[k]);
  const dh = dayH.length ? dayH : keys.slice(0, 10).map(k => H[k]);
  const maxPop = Math.max(...dh.map(h => +h.POP || 0)), rain = dh.some(h => +h.PTY > 0), avgReh = dh.reduce((s, h) => s + (+h.REH || 0), 0) / dh.length;
  const maxW = Math.max(...dh.map(h => +h.WSD || 0)), ts = dh.map(h => +h.TMP), dmax = Math.max(...ts), dmin = Math.min(...ts);
  const soon = keys.filter(k => k >= nowKey).slice(0, 36).some(k => +H[k].POP >= 60 || +H[k].PTY > 0);
  const lv = s => s >= 2 ? "bad" : s >= 1 ? "ok" : "good";
  let uvv = null; const u = D.uv; if(u && u.date && u.date.slice(0, 8) === today){ const d0 = +u.date.slice(8, 10), v = []; for(let k = 0; k <= 21; k += 3) if(d0 + k < 24 && u["h" + k] !== "" && u["h" + k] != null) v.push(+u["h" + k]); if(v.length) uvv = Math.max(...v); }
  const IX = [["자외선", uvv == null ? "" : uvv >= 6 ? "bad" : uvv >= 3 ? "ok" : "good", uvv == null ? "발표 전" : "자외선지수 " + uvv],
    ["빨래", lv((rain || maxPop >= 60 ? 2 : maxPop >= 30 ? 1 : 0) + (avgReh >= 80 ? 1 : 0) + (dmax < 5 ? 1 : 0)), `강수확률 ${maxPop}% · 습도 ${Math.round(avgReh)}%`],
    ["세차", soon ? "bad" : maxPop >= 30 ? "ok" : "good", soon ? "하루 반 안에 비 소식" : "비 소식 없음"],
    ["산책", walk({TMP: (dmax + dmin) / 2, POP: maxPop, WSD: maxW, PTY: rain ? 1 : 0}, p10.c), "기온·비·바람·미세먼지"],
    ["달리기", lv((rain ? 2 : maxPop >= 50 ? 1 : 0) + (dmax > 28 || dmin < -5 ? 1 : 0) + (p25.c === "bad" ? 1 : 0)), "비·기온·초미세먼지"],
    ["자전거", lv((rain ? 2 : 0) + (maxW >= 7 ? 1 : 0) + (dmin < 0 ? 1 : 0)), `최대 바람 ${maxW}m/s`],
    ["감기", dmin < -5 ? "bad" : (dmax - dmin >= 10 || dmin < 0) ? "ok" : "good", `일교차 ${Math.round(dmax - dmin)}°`],
    ["마스크", p10.c === "bad" || p25.c === "bad" ? "bad" : p10.c === "ok" || p25.c === "ok" ? "ok" : "good", "미세먼지 등급"]];
  const ix = IX.map(([n, c, why]) => `<div class="it ${c}" title="${esc(n + " · " + why)}"><span class="ic">${IXI[n]}</span><div class="tx"><b>${n}</b><span>${c ? TIP[n][GI[c]] : esc(why)}</span></div>${c ? `<span class="gr">${GN[c]}</span>` : ""}</div>`).join("");
  html += `<div class="tri"><section class="card"><h2>주간 10일 <small>오전 · 오후 · 강수확률</small></h2>${wk}</section>
    <section class="card"><h2>오늘의 생활지수 <span class="lg"><i class="good">●</i>좋음<i class="ok">●</i>보통<i class="bad">●</i>나쁨</span></h2><div class="ix">${ix}</div></section>${newsCard}</div>`;
  body.innerHTML = html;
  // 뉴스는 옆 칸 높이만큼, 반쯤 잘리는 기사는 숨김
  const ul = $(".tri .nl"); if(ul){ const b = ul.getBoundingClientRect().bottom + 1; [...ul.children].forEach(li => { if(li.getBoundingClientRect().bottom > b) li.hidden = true; }); }
}
fetch("weather.json", {cache: "no-store"}).then(r => r.json()).then(render).catch(e => { $("#body").innerHTML = `<div class="err">날씨 자료를 불러오지 못했어요: ${esc(e.message)}</div>`; });
</script>
</body></html>
